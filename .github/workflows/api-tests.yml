name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
          cache: pip

      - name: Set up Node.js for Allure
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check code style
        run: |
          python -m ruff check .
          python -m ruff format . --check

      - name: Run API tests
        id: tests
        run: >-
          python -m pytest -v
          --alluredir=allure-results --clean-alluredir
          --junitxml=reports/junit.xml

      - name: Generate Allure HTML report
        if: ${{ !cancelled() && hashFiles('allure-results/*-result.json') != '' }}
        run: >-
          npx --yes allure@3.22.1 awesome allure-results
          --output allure-report --single-file
          --report-name "Pizzaed API Tests"

      - name: Upload test results and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: |
            allure-results/
            allure-report/
            reports/junit.xml
          if-no-files-found: warn
          retention-days: 14
